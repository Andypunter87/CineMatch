const C = {

  pink:'#FF4D8F', yellow:'#FFC93C', blue:'#4D6EFF',
  mint:'#5FD4A8', lilac:'#C9A7FF', coral:'#FF8C5A',
};

// ── Films catalogue ────────────────────────────────────────────
const FILMS = [

  { id:4,  title:'Past Lives', year:2023, director:'Celine Song',
    tags:['bittersweet','quiet','romantic','melancholic','slow'],
    blurb:'Two childhood friends, twenty years apart.',
    why:{ cosy:50, thinky:70, funny:15, tense:25, romantic:95 },

  { id:5,  title:'Parasite', year:2019, director:'Bong Joon-ho',

  { id:6,  title:'Hot Fuzz', year:2007, director:'Edgar Wright',

    blurb:'Supercop. Village. Not what it seems.',
    why:{ cosy:55, thinky:40, funny:95, tense:70, romantic:20 },
    streaming:'Netflix', runtime:'121 min', rating:'R',
    colors:['#D64545','#4A6B2F','#8B9467'], stripe:'splash' },
  { id:7,  title:'In the Mood for Love', year:2000, director:'Wong Kar-wai',

// ── Slot machine options ──────────────────────────────────────
const REELS = [
  { l:'FEEL',    col: C.pink,
    opts:['cosy','bittersweet','silly','thinky','tense','romantic','weird','swoony'] },
  { l:'FLAVOUR', col: C.blue,
    opts:['neon + rain','cosy','slow burn','wild ride','escapist','grounded','cinematic'] },
  { l:'LENGTH',  col: C.yellow,
    opts:['under 90m','~2 hrs','epic ok'] },
  { l:'ERA',     col: C.mint,
    opts:["today","'10s","'00s","'90s","'80s","classic"] },
];

// ── Film matching: slot reels → top 5 films ──────────────────
function matchFilms(reels) {
  const feel = reels[0].opts[reels[0].i];
  const feelMap = {
    cosy:{cosy:3,funny:1}, bittersweet:{romantic:2,thinky:2}, silly:{funny:3},
    thinky:{thinky:3}, tense:{tense:3}, romantic:{romantic:3},
    weird:{thinky:1,funny:1}, swoony:{romantic:2,cosy:1},
  };
  const wants = feelMap[feel] || {thinky:1};
  return FILMS.map(f => {
    let score = 0;
    Object.entries(wants).forEach(([k,w]) => score += (f.why[k]||0) * w);
    return { film:f, score };
  }).sort((a,b)=>b.score-a.score).slice(0,5).map(r=>r.film);
}

// Streaming platform URLs
const STREAMING_URLS = {
  'Netflix':  'https://www.netflix.com/search?q=',
  'Prime':    'https://www.amazon.co.uk/s?k=',
  'MUBI':     'https://mubi.com/en/films/',
  'Disney+':  'https://www.disneyplus.com/search/',
};

function getStreamingUrl(film) {
  const base = STREAMING_URLS[film.streaming] || 'https://www.google.com/search?q=';
  return base + encodeURIComponent(film.title);
}

// Simulate DB write — in production this posts to /api/watch-choices
async function logWatchChoice(film, vibe) {
  console.log('[Cinematch DB]', { action:'watch_choice', filmId:film.id, title:film.title, vibe, ts:new Date().toISOString() });
  // POST /api/watch-choices { filmId, vibe, ts }
  return true;
}

// ── Group taste blend: simulated member fingerprints ──────────
const GROUP_MEMBERS = [
  { n:'Andy',  taste:{ cosy:80, thinky:60, funny:75, tense:40, romantic:55 } },
  { n:'Sam',   taste:{ cosy:70, thinky:80, funny:50, tense:60, romantic:70 } },
  { n:'Tay',   taste:{ cosy:90, thinky:30, funny:85, tense:25, romantic:50 } },
];

function blendGroupTaste() {
  const blend = { cosy:0, thinky:0, funny:0, tense:0, romantic:0 };
  GROUP_MEMBERS.forEach(m => Object.keys(blend).forEach(k => blend[k] += m.taste[k]));
  Object.keys(blend).forEach(k => blend[k] = Math.round(blend[k] / GROUP_MEMBERS.length));
  return blend;
}

function matchFilmsGroup(reels) {
  const feel = reels[0].opts[reels[0].i];
  const feelMap = {
    cosy:{cosy:3,funny:1}, bittersweet:{romantic:2,thinky:2}, silly:{funny:3},
    thinky:{thinky:3}, tense:{tense:3}, romantic:{romantic:3},
    weird:{thinky:1,funny:1}, swoony:{romantic:2,cosy:1},
  };
  const vibeWants = feelMap[feel] || {thinky:1};
  const groupTaste = blendGroupTaste();

  return FILMS.map(f => {
    let score = 0;
    // Vibe match (tonight's slot picks)
    Object.entries(vibeWants).forEach(([k,w]) => score += (f.why[k]||0) * w * 1.5);
    // Group taste blend
    Object.entries(groupTaste).forEach(([k,v]) => score += (f.why[k]||0) * (v/100));
    return { film:f, score };
  }).sort((a,b)=>b.score-a.score).slice(0,5).map(r=>r.film);
}

window._C = C; window._FILMS = FILMS; window._REELS = REELS; window._matchFilms = matchFilms; window._matchFilmsGroup = matchFilmsGroup;

// ═══════════════════════════════════════════════════════════════
// SCREEN 2: SLOT MACHINE — solo
// ═══════════════════════════════════════════════════════════════
function SlotMachine({ onFind, onBack, isGroup }) {
  const initReels = REELS.map((r, i) => ({ ...r, i: i === 0 ? 0 : i === 1 ? 1 : 0, locked: false }));
  const [reels, setReels] = useState(initReels);
  const [rolling, setRolling] = useState(false);
  const touchStart = useRef({});

  function setReelIdx(ri, ni) {
    setReels((prev) => prev.map((r, i) => i === ri ? { ...r, i: (ni + r.opts.length) % r.opts.length } : r));
  }
  function toggleLock(ri) {
    setReels((prev) => prev.map((r, i) => i === ri ? { ...r, locked: !r.locked } : r));
  }
  function roll() {
    setRolling(true);
    let count = 0;
    const interval = setInterval(() => {
      setReels((prev) => prev.map((r) => r.locked ? r : { ...r, i: Math.floor(Math.random() * r.opts.length) }));
      count++;
      if (count > 8) {clearInterval(interval);setRolling(false);}
    }, 80);
  }

  const locked = reels.reduce((a, r) => a && r.locked, true);

  // Touch swipe on each reel
  function onTouchStart(ri, e) {
    touchStart.current[ri] = e.touches[0].clientX;
  }
  function onTouchEnd(ri, e) {
    const dx = e.changedTouches[0].clientX - (touchStart.current[ri] || 0);
    if (Math.abs(dx) > 30) setReelIdx(ri, reels[ri].i + (dx < 0 ? 1 : -1));
  }

  return (
    <Screen>
      <div style={{ padding: '0 20px 8px', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
        <button onClick={onBack} style={{ background: 'none', border: 'none', fontFamily: 'Caveat,cursive', fontSize: 20, color: C.inkSoft, padding: 0, whiteSpace: 'nowrap' }}>← back</button>
        <div style={{ fontFamily: 'Space Mono,monospace', fontSize: 10, letterSpacing: '.1em', color: C.inkSoft, textTransform: 'uppercase' }}>{isGroup ? 'group · 3 people' : 'just me'}</div>
      </div>

      <div style={{ padding: '0 20px 6px' }}>
        <div style={{ fontWeight: 700, fontSize: 34, lineHeight: 1, color: C.ink, fontFamily: 'Caveat,cursive' }}>{isGroup ? "what's the group vibe?" : 'spin your mood'}</div>
        <div style={{ fontFamily: 'Nunito,sans-serif', fontSize: 13, color: C.inkSoft, marginTop: 4 }}>{isGroup ? "set tonight's vibe — i'll blend everyone's taste to find the best match" : 'swipe ↔  ·  tap 🔒 to keep  ·  ROLL spins the rest'}</div>
      </div>

      <div style={{ padding: '0 20px', flex: 1, overflow: 'auto' }}>
        {reels.map((r, ri) => {
          const prev = r.opts[(r.i - 1 + r.opts.length) % r.opts.length];
          const curr = r.opts[r.i];
          const next = r.opts[(r.i + 1) % r.opts.length];
          return (
            <div key={ri} style={{
              border: `2px solid ${C.ink}`, borderRadius: 14, marginTop: ri ? 10 : 0,
              background: C.paper2, overflow: 'hidden',
              boxShadow: r.locked ? `3px 3px 0 ${C.ink}` : 'none',
              opacity: rolling && !r.locked ? .7 : 1,
              transition: 'opacity .1s'
            }}>
              {/* Header */}
              <div style={{
                display: 'flex', justifyContent: 'space-between', alignItems: 'center',
                padding: '5px 10px', background: r.col,
                color: ri === 2 ? C.ink : 'white',
                fontFamily: 'Space Mono,monospace', fontSize: 10, letterSpacing: '.1em',
                borderBottom: `2px solid ${C.ink}`
              }}>
                <span>{r.l}</span>
                <span style={{ opacity: .8 }}>{r.i + 1}/{r.opts.length}</span>
              </div>

              {/* Swipe strip */}
              <div style={{ padding: '10px 8px 4px', display: 'flex', alignItems: 'center', gap: 8 }}
              onTouchStart={(e) => onTouchStart(ri, e)} onTouchEnd={(e) => onTouchEnd(ri, e)}>
                {/* Lock */}
                <button onClick={() => toggleLock(ri)} style={{
                  width: 30, height: 30, borderRadius: '50%', flexShrink: 0,
                  border: `1.5px solid ${C.ink}`, fontSize: 14,
                  background: r.locked ? C.yellow : C.paper,
                  boxShadow: r.locked ? `1.5px 1.5px 0 ${C.ink}` : 'none'
                }}>{r.locked ? '🔒' : '🔓'}</button>

                {/* Options strip */}
                <div style={{ flex: 1, overflow: 'hidden', display: 'flex', alignItems: 'center', gap: 14 }}>
                  <div style={{ fontFamily: 'Caveat,cursive', fontSize: 16, fontWeight: 700, opacity: .25, whiteSpace: 'nowrap' }}>{prev}</div>
                  <div style={{ fontSize: 24, fontWeight: 700, color: C.ink, whiteSpace: 'nowrap', flex: 1, textAlign: 'center', fontFamily: "Nunito" }}>{curr}</div>
                  <div style={{ fontFamily: 'Caveat,cursive', fontSize: 16, fontWeight: 700, opacity: .25, whiteSpace: 'nowrap' }}>{next}</div>
                </div>

                {/* Arrows */}
                <div style={{ display: 'flex', gap: 4 }}>
                  <button onClick={() => setReelIdx(ri, r.i - 1)} style={{ width: 24, height: 24, border: `1.5px solid ${C.ink}`, borderRadius: 6, background: C.paper, fontSize: 12 }}>‹</button>
                  <button onClick={() => setReelIdx(ri, r.i + 1)} style={{ width: 24, height: 24, border: `1.5px solid ${C.ink}`, borderRadius: 6, background: C.paper, fontSize: 12 }}>›</button>
                </div>
              </div>

              {/* Dot pagination */}
              <div style={{ display: 'flex', justifyContent: 'space-between', padding: '2px 10px 8px', alignItems: 'center' }}>
                <div style={{ fontFamily: 'Space Mono,monospace', fontSize: 8, color: C.inkLight }}>‹ swipe ›</div>
                <div style={{ display: 'flex', gap: 3 }}>
                  {r.opts.map((_, oi) =>
                  <div key={oi} style={{
                    width: oi === r.i ? 10 : 4, height: 4, borderRadius: 2,
                    background: oi === r.i ? C.ink : C.inkLight,
                    opacity: oi === r.i ? 1 : .4,
                    transition: 'width .2s'
                  }} />
                  )}
                </div>
              </div>
            </div>);

        })}

        {/* Cine readback */}
        <div style={{
          margin: '12px 0 0', padding: '10px 12px',
          border: `1.5px dashed ${C.ink}`, borderRadius: 12,
          background: C.paper, display: 'flex', gap: 8, alignItems: 'flex-start'
        }}>
          <Cine size={26} />
          <div style={{ fontFamily: 'Nunito,sans-serif', fontSize: 12, lineHeight: 1.35, color: C.ink, flex: 1 }}>
            reading: <b style={{ fontFamily: 'Caveat,cursive', fontSize: 15 }}>{reels[0].opts[reels[0].i]}</b>
            {' '}· <b style={{ fontFamily: 'Caveat,cursive', fontSize: 15 }}>{reels[1].opts[reels[1].i]}</b>
            {' '}· <b style={{ fontFamily: 'Caveat,cursive', fontSize: 15 }}>{reels[2].opts[reels[2].i]}</b>
          </div>
        </div>
      </div>

      {/* Actions */}
      <div style={{ padding: '10px 20px 28px', display: 'flex', gap: 10 }}>
        <Btn onClick={roll} small outline style={{ flex: 1, justifyContent: 'center' }}>🎲 ROLL</Btn>
        <Btn onClick={() => onFind(reels, {})} primary small style={{ flex: 2, justifyContent: 'center' }}>🎬 find it →</Btn>
      </div>
    </Screen>);

}

// ═══════════════════════════════════════════════════════════════
// SCREEN 3: CINE LOADING — "let me think…"
// ═══════════════════════════════════════════════════════════════
function CineLoading({ film, onReady }) {
  const [dot, setDot] = useState(0);
  useEffect(() => {
    const t = setInterval(() => setDot((d) => (d + 1) % 4), 350);
    const done = setTimeout(onReady, 2200);
    return () => {clearInterval(t);clearTimeout(done);};
  }, []);
  return (
    <Screen bg={C.paper2}>
      <div style={{ flex: 1, display: 'flex', flexDirection: 'column', justifyContent: 'center', alignItems: 'center', padding: '0 32px', gap: 20 }}>
        <div style={{
          width: 80, height: 80, borderRadius: '50%',
          background: C.yellow, border: `3px solid ${C.ink}`,
          display: 'flex', alignItems: 'center', justifyContent: 'center',
          fontFamily: 'Caveat,cursive', fontWeight: 700, fontSize: 36,
          color: C.ink, boxShadow: `4px 4px 0 ${C.ink}`,
          animation: 'none'
        }}>C</div>
        <div style={{ fontFamily: 'Caveat,cursive', fontWeight: 700, fontSize: 30, lineHeight: 1, color: C.ink, textAlign: 'center' }}>
          finding something perfect{'.' + (dot > 0 ? '.' : '') + (dot > 1 ? '.' : '') + (dot > 2 ? '.' : '')}
        </div>
        <div style={{ fontFamily: 'Nunito,sans-serif', fontSize: 14, color: C.inkSoft, textAlign: 'center', lineHeight: 1.4 }}>
          finding you the perfect watch
        </div>
        <div style={{
          background: C.paper, border: `2px solid ${C.ink}`, borderRadius: 14,
          padding: '12px 16px', width: '100%', boxShadow: `3px 3px 0 ${C.ink}`
        }}>
          <div style={{ fontFamily: 'Space Mono,monospace', fontSize: 9, letterSpacing: '.12em', color: C.inkLight, textTransform: 'uppercase', marginBottom: 4 }}>best match</div>
          <div style={{ fontFamily: 'Caveat,cursive', fontWeight: 700, fontSize: 22, color: C.ink, lineHeight: 1 }}>{film.title}</div>
          <div style={{ fontFamily: 'Nunito,sans-serif', fontSize: 12, color: C.inkSoft, marginTop: 4 }}>checking {film.streaming} · {film.runtime}</div>
        </div>
      </div>
    </Screen>);

}

// ═══════════════════════════════════════════════════════════════
// SCREEN 4: MOVIE DETAIL — swipeable deck of 5, hybrid bars
// ═══════════════════════════════════════════════════════════════
function MovieDetail({ films, reels, onWatch, onBack }) {
  const [idx, setIdx] = useState(0);
  const [saved, setSaved] = useState({});
  const [watching, setWatching] = useState(false);
  const dragRef = useRef({ x: 0, active: false });
  const [dragX, setDragX] = useState(0);
  const [flying, setFlying] = useState(null);

  const film = films[idx];
  const nextFilm = films[idx + 1];
  const feel = reels ? reels[0]?.opts[reels[0]?.i] : 'cosy';

  const why = {
    cosy: `you said cosy — this one wraps you up like a blanket.`,
    bittersweet: `${film.title} is bittersweet in the best way. exactly what you asked for.`,
    thinky: `big ideas, careful filmmaking. this one'll stick around in your head.`,
    tense: `buckle up. ${film.title} earns every minute.`,
    romantic: `not a romcom. something better — it trusts you to feel it.`,
    funny: `genuinely funny. not quirky, not charming — actually funny.`,
    silly: `joyful and loose. perfect for tonight.`,
    weird: `strange and wonderful. not for everyone — but definitely for you.`,
    swoony: `slow-burn kind. let it wash over you.`
  }[feel] || `${film.title} hits the vibe you're after.`;

  function handleDown(e) {
    const p = e.touches ? e.touches[0] : e;
    dragRef.current = { x: p.clientX, active: true };
  }
  function handleMove(e) {
    if (!dragRef.current.active) return;
    const p = e.touches ? e.touches[0] : e;
    setDragX(p.clientX - dragRef.current.x);
  }
  function handleUp() {
    if (!dragRef.current.active) return;
    dragRef.current.active = false;
    if (dragX > 80) {flyCard('right');} else
    if (dragX < -80) {flyCard('left');} else
    setDragX(0);
  }

  useEffect(() => {
    window.addEventListener('mousemove', handleMove);
    window.addEventListener('mouseup', handleUp);
    window.addEventListener('touchmove', handleMove);
    window.addEventListener('touchend', handleUp);
    return () => {
      window.removeEventListener('mousemove', handleMove);
      window.removeEventListener('mouseup', handleUp);
      window.removeEventListener('touchmove', handleMove);
      window.removeEventListener('touchend', handleUp);
    };
  }, [dragX]);

  function flyCard(dir) {
    setFlying(dir);
    setTimeout(() => {
      setFlying(null);setDragX(0);
      setIdx((i) => Math.min(i + 1, films.length - 1));
    }, 300);
  }

  async function handleWatch() {
    setWatching(true);
    await logWatchChoice(film, feel);
    setTimeout(() => {
      onWatch(film);
    }, 600);
  }

  const rot = dragX * 0.05;
  const cardTransform = flying === 'right' ?
  'translate(500px,-80px) rotate(25deg)' :
  flying === 'left' ?
  'translate(-500px,-80px) rotate(-25deg)' :
  `translate(${dragX}px,0) rotate(${rot}deg)`;

  const likeOpacity = Math.min(1, Math.max(0, dragX / 80));
  const skipOpacity = Math.min(1, Math.max(0, -dragX / 80));

  return (
    <Screen bg={C.paper2}>
      <div style={{ padding: '0 18px 6px', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
        <button onClick={onBack} style={{ background: 'none', border: 'none', fontFamily: 'Caveat,cursive', fontSize: 20, color: C.inkSoft, padding: 0 }}>← back</button>
        <div style={{ fontFamily: 'Space Mono,monospace', fontSize: 10, letterSpacing: '.1em', color: C.inkSoft, textTransform: 'uppercase' }}>
          {idx + 1} of {films.length}
        </div>
        <button onClick={() => setSaved((s) => ({ ...s, [film.id]: !s[film.id] }))} style={{
          background: saved[film.id] ? C.pink : C.paper, color: saved[film.id] ? 'white' : C.ink,
          border: `1.5px solid ${C.ink}`, borderRadius: '50%',
          width: 32, height: 32, fontSize: 16,
          boxShadow: saved[film.id] ? `2px 2px 0 ${C.ink}` : 'none'
        }}>{saved[film.id] ? '♥' : '♡'}</button>
      </div>

      {/* Dot pagination */}
      <div style={{ display: 'flex', justifyContent: 'center', gap: 5, marginBottom: 8 }}>
        {films.map((_, i) =>
        <div key={i} style={{
          width: i === idx ? 18 : 6, height: 6, borderRadius: 3,
          background: i === idx ? C.pink : C.inkLight,
          opacity: i === idx ? 1 : .35, transition: 'width .2s'
        }} />
        )}
      </div>

      {/* Card stack */}
      <div style={{ flex: 1, padding: '0 18px', position: 'relative', display: 'flex', flexDirection: 'column', overflow: 'hidden', minHeight: 0 }}>

        {/* Back card hint */}
        {nextFilm &&
        <div style={{ position: 'absolute', top: 6, left: 28, right: 28, bottom: 0,
          border: `2px solid ${C.ink}`, borderRadius: 16,
          background: C.paper, opacity: .45, transform: 'rotate(2deg) translateY(6px)', zIndex: 0 }} />
        }

        {/* Front card */}
        <div
          onMouseDown={handleDown} onTouchStart={handleDown}
          style={{
            position: 'relative', zIndex: 1, flex: 1, display: 'flex', flexDirection: 'column',
            transform: cardTransform,
            transition: flying ? 'transform .3s ease-out' : dragRef.current.active ? 'none' : 'transform .2s ease',
            cursor: 'grab', userSelect: 'none', touchAction: 'none'
          }}>
          <div style={{
            border: `2px solid ${C.ink}`, borderRadius: 16,
            background: C.paper, boxShadow: `5px 5px 0 ${C.ink}`,
            padding: 14, flex: 1, display: 'flex', flexDirection: 'column', overflow: 'hidden'
          }}>
            {/* LOVE / SKIP stamps */}
            <div style={{ position: 'absolute', top: 20, right: 16, transform: 'rotate(14deg)',
              padding: '5px 12px', border: `3px solid ${C.pink}`, color: C.pink,
              fontFamily: 'Caveat,cursive', fontWeight: 700, fontSize: 24, borderRadius: 6,
              opacity: likeOpacity, background: 'rgba(255,77,143,.08)', pointerEvents: 'none', zIndex: 10 }}>LOVE ♥</div>
            <div style={{ position: 'absolute', top: 20, left: 16, transform: 'rotate(-14deg)',
              padding: '5px 12px', border: `3px solid ${C.inkSoft}`, color: C.inkSoft,
              fontFamily: 'Caveat,cursive', fontWeight: 700, fontSize: 24, borderRadius: 6,
              opacity: skipOpacity, background: 'rgba(74,74,74,.06)', pointerEvents: 'none', zIndex: 10 }}>SKIP</div>

            {/* Poster — fills remaining space */}
            <div style={{ flex: 1, minHeight: 0, borderRadius: 10, overflow: 'hidden', position: 'relative', border: `1.5px solid ${C.ink}` }}>
              {(() => {
                const [c1, c2, c3] = film.colors;
                const pats = {
                  horizontal: `repeating-linear-gradient(180deg,${c1} 0 28px,${c2} 28px 56px,${c3} 56px 84px)`,
                  diagonal: `repeating-linear-gradient(135deg,${c1} 0 22px,${c2} 22px 44px,${c3} 44px 66px)`,
                  vertical: `repeating-linear-gradient(90deg,${c1} 0 32px,${c2} 32px 64px,${c3} 64px 96px)`,
                  burst: `radial-gradient(circle at 50% 50%,${c1} 0%,${c2} 40%,${c3} 80%)`,
                  flame: `linear-gradient(180deg,${c1} 0%,${c1} 40%,${c2} 55%,${c3} 100%)`,
                  splash: `radial-gradient(ellipse at 30% 30%,${c1} 0%,${c2} 45%,${c3} 100%)`,
                  neon: `linear-gradient(135deg,${c2} 0% 50%,${c3} 50% 100%)`
                };
                return <div style={{ width: '100%', height: '100%', background: pats[film.stripe] || pats.horizontal }} />;
              })()}
              {/* Title overlay */}
              <div style={{ position: 'absolute', left: 10, right: 10, bottom: 10,
                background: 'rgba(250,246,238,.93)', border: `1.5px solid ${C.ink}`,
                borderRadius: 8, padding: '8px 10px' }}>
                <div style={{ fontFamily: 'Caveat,cursive', fontWeight: 700, fontSize: 24, lineHeight: 1, color: C.ink }}>{film.title}</div>
                <div style={{ fontFamily: 'Space Mono,monospace', fontSize: 8, letterSpacing: '.1em', color: C.inkSoft, marginTop: 3, textTransform: 'uppercase' }}>{film.year} · {film.director}</div>
              </div>
            </div>

            {/* Chips */}
            <div style={{ display: 'flex', gap: 6, marginTop: 10, flexWrap: 'wrap' }}>
              <Chip color={C.blue} text={film.streaming} />
              <Chip text={film.runtime} />
              <Chip text={film.rating} />
            </div>

            {/* Cine why */}
            <div style={{
              marginTop: 8, padding: '8px 10px',
              background: C.yellow, border: `1.5px solid ${C.ink}`, borderRadius: 10
            }}>
              <div style={{ fontFamily: 'Space Mono,monospace', fontSize: 8, letterSpacing: '.12em', color: C.ink, textTransform: 'uppercase', marginBottom: 3 }}>cine says ✦</div>
              <div style={{ fontFamily: 'Nunito,sans-serif', fontSize: 12, lineHeight: 1.35, color: C.ink }}>"{why}"</div>
            </div>

            {/* Vibe bars */}
            <div style={{ background: C.paper2, border: `1.5px solid ${C.ink}`, borderRadius: 10, padding: '8px 10px', marginTop: 8 }}>
              <div style={{ fontFamily: 'Space Mono,monospace', fontSize: 8, letterSpacing: '.1em', color: C.inkLight, textTransform: 'uppercase', marginBottom: 6 }}>what you're in for</div>
              <VibeBars film={film} />
            </div>
          </div>
        </div>
      </div>

      {/* Actions */}
      <div style={{ padding: '10px 18px 28px' }}>
        <div style={{ display: 'flex', gap: 8, marginBottom: 8 }}>
          <button onClick={() => flyCard('left')} style={{
            flex: 1, padding: '10px', border: `2px solid ${C.ink}`, borderRadius: 100,
            background: C.paper, fontFamily: 'Caveat,cursive', fontWeight: 700, fontSize: 18,
            boxShadow: `3px 3px 0 ${C.ink}`, cursor: 'pointer'
          }}>← next pick</button>
          <button onClick={handleWatch} disabled={watching} style={{
            flex: 2, padding: '10px 20px', border: `2px solid ${C.ink}`, borderRadius: 100,
            background: watching ? C.paper2 : C.ink, color: watching ? C.inkLight : 'white',
            fontFamily: 'Caveat,cursive', fontWeight: 700, fontSize: 20,
            boxShadow: watching ? 'none' : `3px 3px 0 ${C.ink}`, cursor: watching ? 'default' : 'pointer'
          }}>{watching ? 'opening…' : '▶ watch it'}</button>
        </div>
        <div style={{ fontFamily: 'Space Mono,monospace', fontSize: 8, letterSpacing: '.1em', color: C.inkLight, textTransform: 'uppercase', textAlign: 'center' }}>
          swipe ← to skip · swipe → to save · tap watch to go
        </div>
      </div>
    </Screen>);

}

function Chip({ text, color }) {
  return (
    <div style={{
      padding: '3px 10px', background: color || C.paper,
      border: `1.5px solid ${C.ink}`, borderRadius: 100,
      fontFamily: 'Nunito,sans-serif', fontSize: 11, color: C.ink
    }}>{text}</div>);

}

// ═══════════════════════════════════════════════════════════════
// SCREEN 5: POST-WATCH RATING + MOOD CARD DROP
// ═══════════════════════════════════════════════════════════════
function PostWatch({ film, onRate, onSkip }) {
  const [hover, setHover] = useState(null);
  const [rated, setRated] = useState(null);
  const [showDrop, setShowDrop] = useState(false);

  function handleRate(s) {
    setRated(s);
    // Open the streaming platform after rating
    window.open(getStreamingUrl(film), '_blank');
    setTimeout(() => setShowDrop(true), 400);
  }

  if (showDrop) return <MoodCardDrop film={film} rating={rated} onDone={onRate} />;

  return (
    <Screen>
      <div style={{ padding: '0 22px', flex: 1, display: 'flex', flexDirection: 'column', gap: 16 }}>
        <div style={{ marginTop: 8 }}>
          <div style={{ fontFamily: 'Space Mono,monospace', fontSize: 10, letterSpacing: '.15em', color: C.inkSoft, textTransform: 'uppercase' }}>how was it?</div>
          <div style={{ fontFamily: 'Caveat,cursive', fontWeight: 700, fontSize: 36, lineHeight: 1, marginTop: 4, color: C.ink }}>{film.title}</div>
        </div>

        <div style={{ display: 'flex', gap: 8, alignItems: 'flex-start' }}>
          <Cine size={30} mood="think" />
          <CineBubble>good choice? give it some stars and i'll get better at this 🌟</CineBubble>
        </div>

        <div style={{
          background: C.paper2, border: `2px solid ${C.ink}`, borderRadius: 16,
          padding: '14px 16px', boxShadow: `3px 3px 0 ${C.ink}`
        }}>
          <div style={{ fontFamily: 'Space Mono,monospace', fontSize: 9, letterSpacing: '.12em', color: C.inkLight, textTransform: 'uppercase', marginBottom: 12 }}>your rating</div>
          <div style={{ display: 'flex', gap: 8, justifyContent: 'center' }}>
            {[1, 2, 3, 4, 5].map((s) =>
            <button key={s}
            onClick={() => handleRate(s)}
            onMouseEnter={() => setHover(s)}
            onMouseLeave={() => setHover(null)}
            style={{
              width: 50, height: 50, borderRadius: '50%',
              border: `2px solid ${rated && s <= rated ? C.pink : hover && s <= hover ? C.pink : C.ink}`,
              background: rated && s <= rated ? C.pink : hover && s <= hover ? C.pink : C.paper,
              color: rated && s <= rated ? 'white' : hover && s <= hover ? 'white' : C.ink,
              fontSize: 22,
              boxShadow: (rated || hover) && s <= (rated || hover) ? `2px 2px 0 ${C.ink}` : 'none',
              transform: (rated || hover) && s <= (rated || hover) ? 'translate(-1px,-1px)' : 'none',
              transition: 'all .1s ease'
            }}>★</button>
            )}
          </div>
          <div style={{ display: 'flex', justifyContent: 'space-between', marginTop: 8, padding: '0 4px' }}>
            <div style={{ fontFamily: 'Space Mono,monospace', fontSize: 8, color: C.inkLight, textTransform: 'uppercase', letterSpacing: '.08em' }}>meh</div>
            <div style={{ fontFamily: 'Space Mono,monospace', fontSize: 8, color: C.inkLight, textTransform: 'uppercase', letterSpacing: '.08em' }}>loved it</div>
          </div>
        </div>

        <button onClick={onSkip} style={{
          background: 'none', border: 'none', fontFamily: 'Nunito,sans-serif',
          fontSize: 13, color: C.inkSoft, textDecoration: 'underline', cursor: 'pointer', textAlign: 'center'
        }}>skip for now</button>
      </div>
    </Screen>);

}

// ═══════════════════════════════════════════════════════════════
// MOOD CARD DROP — the rare reward
// ═══════════════════════════════════════════════════════════════
function MoodCardDrop({ film, rating, onDone }) {
  const [revealed, setRevealed] = useState(false);

  return (
    <Screen bg={C.paper2}>
      <div style={{ flex: 1, display: 'flex', flexDirection: 'column', justifyContent: 'center', padding: '0 22px', gap: 16 }}>
        {!revealed ?
        <>
            <div style={{
            background: C.yellow, border: `2px solid ${C.ink}`, borderRadius: 14,
            padding: '14px 16px', boxShadow: `4px 4px 0 ${C.ink}`, transform: 'rotate(-.8deg)'
          }}>
              <div style={{ fontFamily: 'Space Mono,monospace', fontSize: 10, letterSpacing: '.15em', color: C.ink, textTransform: 'uppercase' }}>RARE DROP ✦</div>
              <div style={{ fontFamily: 'Caveat,cursive', fontWeight: 700, fontSize: 26, lineHeight: 1, marginTop: 6, color: C.ink }}>your april mood card is ready!</div>
              <div style={{ fontFamily: 'Nunito,sans-serif', fontSize: 13, lineHeight: 1.35, color: C.ink, marginTop: 6 }}>
                based on everything you've watched this month. drops like this happen 1–4× a month.

  useEffect(() => {localStorage.setItem('cr_step', step);}, [step]);
  useEffect(() => {localStorage.setItem('cr_group', group ? '1' : '0');}, [group]);
  useEffect(() => {setTimeout(() => setLoaded(true), 100);}, []);

  function goFind(r, extra) {setReels(r);const fs = matchFilms(r);setFilms(fs);setStep('loading');}
  function goGroupFilm(f) {setFilms([f, ...FILMS.filter((x) => x.id !== f.id).slice(0, 4)]);setStep('detail');}

  let screen;
  switch (step) {
    case 'fork':screen = <ForkScreen onSolo={() => {setGroup(false);setStep('slot');}} onGroup={() => {setGroup(true);setStep('g1');}} />;break;
    case 'slot':screen = <SlotMachine onFind={goFind} onBack={() => setStep('fork')} />;break;
    case 'loading':screen = <CineLoading film={films[0]} onReady={() => setStep('detail')} />;break;
    case 'detail':screen = <MovieDetail films={films} reels={reels} onWatch={(f) => {setFilms([f]);setStep('rating');}} onBack={() => setStep(group ? 'gslot' : 'slot')} />;break;
    case 'rating':screen = <PostWatch film={films[0]} onRate={() => setStep('done')} onSkip={() => setStep('done')} />;break;
    case 'g1':screen = <GroupInvite onNext={() => setStep('gslot')} onBack={() => setStep('fork')} onPreviewInvitee={() => setStep('notify')} />;break;
    case 'notify':screen = <NotificationScreen onTap={() => setStep('join')} onDismiss={() => setStep('g1')} />;break;
    case 'join':screen = <JoinSession onJoin={() => setStep('gslot')} onBack={() => setStep('notify')} />;break;
    case 'gslot':screen = <SlotMachine isGroup onFind={(r)=>{ setReels(r); const fs=window._matchFilmsGroup(r); setFilms(fs); setStep('loading'); }} onBack={()=>setStep('g1')} />;break;
    case 'g2':screen = <GroupVote onNext={() => setStep('g3')} onBack={() => setStep('g1')} />;break;
    case 'g3':screen = <GroupReveal onFind={goGroupFilm} onBack={() => setStep('g2')} />;break;
    case 'done':screen = <DoneScreen onRestart={() => setStep('fork')} />;break;
    default:screen = <ForkScreen onSolo={() => setStep('slot')} onGroup={() => setStep('g1')} />;
  }

  return (
    <div className="stage">
      <div className="label">Cinematch · recommender loop</div>
      <PhoneWrap>{screen}</PhoneWrap>
      <div className="label" style={{ opacity: .5 }}>{group ? 'group' : 'solo'} · {step}</div>
    </div>);

}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
