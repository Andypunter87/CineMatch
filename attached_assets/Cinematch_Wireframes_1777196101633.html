<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Cinematch — Wireframe Exploration</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600;700&family=Nunito:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
/* ===== Cinematch Wireframes — sketchy, playful system ===== */

:root {
  --paper: #FAF6EE;
  --paper-2: #F3ECDA;
  --ink: #1a1a1a;
  --ink-soft: #4a4a4a;
  --ink-light: #8a8478;
  --line: #1a1a1a;

  --pink: #FF4D8F;
  --yellow: #FFC93C;
  --blue: #4D6EFF;
  --mint: #5FD4A8;
  --lilac: #C9A7FF;
  --coral: #FF8C5A;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: 'Nunito', 'Caveat', system-ui;
  font-size: 16px;
  line-height: 1.4;
  min-height: 100vh;
}

body {
  background-image:
    radial-gradient(circle at 20% 10%, rgba(255,201,60,0.08), transparent 40%),
    radial-gradient(circle at 80% 80%, rgba(77,110,255,0.06), transparent 40%),
    linear-gradient(var(--paper), var(--paper));
}

/* ============== TOP BAR ============== */
.topbar {
  position: sticky;
  top: 0;
  z-index: 50;
  background: var(--paper);
  border-bottom: 2px dashed var(--ink);
  padding: 18px 28px 10px;
}

.topbar-row {
  display: flex;
  align-items: baseline;
  gap: 20px;
  flex-wrap: wrap;
}

.logo {
  font-family: 'Caveat', cursive;
  font-size: 42px;
  font-weight: 700;
  letter-spacing: -0.5px;
  line-height: 1;
  display: inline-flex;
  align-items: center;
  gap: 8px;
}
.logo .dot {
  width: 14px; height: 14px;
  background: var(--pink);
  border: 2px solid var(--ink);
  border-radius: 50%;
  display: inline-block;
  transform: rotate(-6deg);
}
.logo-sub {
  font-family: 'Nunito';
  font-size: 13px;
  color: var(--ink-soft);
  font-weight: 400;
}

.tabs {
  display: flex;
  gap: 10px;
  margin-top: 18px;
  flex-wrap: wrap;
}
.tab {
  font-family: 'Caveat', cursive;
  font-size: 24px;
  font-weight: 700;
  padding: 6px 18px 8px;
  background: var(--paper);
  border: 2px solid var(--ink);
  border-radius: 22px 18px 24px 20px / 18px 22px 20px 24px;
  cursor: pointer;
  transition: transform .15s, background .15s;
  display: inline-flex;
  align-items: center;
  gap: 8px;
}
.tab:hover { transform: translateY(-2px) rotate(-1deg); }
.tab.active {
  background: var(--yellow);
  box-shadow: 3px 3px 0 var(--ink);
  transform: rotate(-1.5deg);
}
.tab .num {
  font-family: 'Space Mono', monospace;
  font-size: 13px;
  background: var(--ink);
  color: var(--paper);
  border-radius: 10px;
  padding: 2px 7px;
  font-weight: 700;
}

/* ============== GALLERY ============== */
.gallery {
  padding: 30px 28px 80px;
  max-width: 1640px;
  margin: 0 auto;
}

.gallery-head {
  margin-bottom: 26px;
  max-width: 720px;
}
.gallery-head h2 {
  font-family: 'Caveat', cursive;
  font-size: 48px;
  line-height: 1;
  margin: 0 0 8px;
  font-weight: 700;
}
.gallery-head p {
  font-family: 'Nunito';
  font-size: 16px;
  color: var(--ink-soft);
  margin: 0;
}
.gallery-head .legend {
  margin-top: 14px;
  font-family: 'Space Mono', monospace;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--ink-light);
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
  gap: 40px 32px;
  align-items: start;
}

.cell {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
}

.cell-tag {
  display: flex;
  align-items: center;
  gap: 10px;
  align-self: flex-start;
  margin-left: 18px;
}
.cell-num {
  font-family: 'Caveat', cursive;
  font-size: 44px;
  font-weight: 700;
  line-height: 1;
  transform: rotate(-6deg);
  color: var(--ink);
}
.cell-title {
  font-family: 'Caveat', cursive;
  font-size: 28px;
  line-height: 1.05;
  font-weight: 700;
}
.cell-desc {
  font-family: 'Nunito';
  font-size: 13px;
  color: var(--ink-soft);
  align-self: flex-start;
  margin-left: 18px;
  max-width: 300px;
  margin-top: -6px;
}

/* ============== PHONE FRAME ============== */
.phone {
  --phone-w: 320px;
  --phone-h: 660px;
  width: var(--phone-w);
  height: var(--phone-h);
  background: var(--ink);
  border-radius: 44px;
  padding: 10px;
  box-shadow:
    6px 8px 0 rgba(26,26,26,0.15),
    0 20px 40px rgba(26,26,26,0.08);
  position: relative;
  flex-shrink: 0;
}

.screen {
  width: 100%;
  height: 100%;
  background: var(--paper);
  border-radius: 36px;
  overflow: hidden;
  position: relative;
  display: flex;
  flex-direction: column;
}

.status {
  height: 28px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 22px;
  font-family: 'Space Mono', monospace;
  font-size: 11px;
  font-weight: 700;
  color: var(--ink);
  flex-shrink: 0;
  position: relative;
  background: transparent;
}
.status::before {
  content: '';
  position: absolute;
  top: 6px;
  left: 50%;
  transform: translateX(-50%);
  width: 90px;
  height: 22px;
  background: var(--ink);
  border-radius: 14px;
}
.status .s-bat { display: inline-flex; gap: 3px; align-items: center; }
.status .s-bat::after {
  content: '';
  width: 20px; height: 9px;
  border: 1.5px solid var(--ink);
  border-radius: 3px;
  background: linear-gradient(to right, var(--ink) 80%, transparent 80%);
  background-size: 100%;
  display: inline-block;
}

.screen-body {
  flex: 1;
  overflow: hidden;
  position: relative;
  display: flex;
  flex-direction: column;
}

/* ===== Screen building blocks ===== */
.sbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 18px 10px;
  border-bottom: 1.5px dashed rgba(26,26,26,0.35);
}
.sbar-title {
  font-family: 'Caveat', cursive;
  font-size: 22px;
  font-weight: 700;
  line-height: 1;
}
.icon-btn {
  width: 30px; height: 30px;
  border-radius: 50%;
  border: 1.5px solid var(--ink);
  background: var(--paper);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-family: 'Space Mono', monospace;
  font-size: 13px;
  cursor: pointer;
}
.icon-btn.round { border-radius: 50%; }

.chip {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-family: 'Nunito';
  font-size: 12px;
  padding: 4px 10px;
  border: 1.5px solid var(--ink);
  border-radius: 14px;
  background: var(--paper);
  line-height: 1.1;
  cursor: pointer;
  transition: transform .15s;
}
.chip:hover { transform: translateY(-1px); }
.chip.chip-pink { background: var(--pink); color: white; }
.chip.chip-yellow { background: var(--yellow); }
.chip.chip-blue { background: var(--blue); color: white; }
.chip.chip-mint { background: var(--mint); }
.chip.chip-lilac { background: var(--lilac); }
.chip.chip-coral { background: var(--coral); color: white; }
.chip.chip-sel { box-shadow: 2px 2px 0 var(--ink); transform: translate(-1px,-1px); }

.btn {
  font-family: 'Caveat', cursive;
  font-size: 22px;
  font-weight: 700;
  padding: 8px 22px 10px;
  border: 2px solid var(--ink);
  border-radius: 18px 22px 20px 24px / 22px 18px 24px 20px;
  background: var(--paper);
  cursor: pointer;
  line-height: 1;
  display: inline-flex;
  align-items: center;
  gap: 8px;
}
.btn.btn-primary { background: var(--pink); color: white; box-shadow: 3px 3px 0 var(--ink); }
.btn.btn-yellow { background: var(--yellow); box-shadow: 3px 3px 0 var(--ink); }
.btn.btn-blue { background: var(--blue); color: white; box-shadow: 3px 3px 0 var(--ink); }
.btn.btn-mint { background: var(--mint); box-shadow: 3px 3px 0 var(--ink); }

/* Poster placeholder */
.poster {
  background:
    repeating-linear-gradient(135deg,
      rgba(26,26,26,0.08) 0 1px,
      transparent 1px 10px),
    var(--paper-2);
  border: 1.5px solid var(--ink);
  border-radius: 10px;
  position: relative;
  overflow: hidden;
  display: flex;
  align-items: flex-end;
}
.poster .poster-label {
  font-family: 'Space Mono', monospace;
  font-size: 9px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--ink-soft);
  padding: 6px;
  background: rgba(250,246,238,0.85);
  width: 100%;
  line-height: 1.1;
}
.poster.p-pink { background-color: color-mix(in oklab, var(--pink) 18%, var(--paper-2)); }
.poster.p-blue { background-color: color-mix(in oklab, var(--blue) 18%, var(--paper-2)); }
.poster.p-yellow { background-color: color-mix(in oklab, var(--yellow) 22%, var(--paper-2)); }
.poster.p-mint { background-color: color-mix(in oklab, var(--mint) 22%, var(--paper-2)); }
.poster.p-lilac { background-color: color-mix(in oklab, var(--lilac) 22%, var(--paper-2)); }
.poster.p-coral { background-color: color-mix(in oklab, var(--coral) 20%, var(--paper-2)); }

/* Bottom tab bar */
.tabbar {
  display: flex;
  justify-content: space-around;
  align-items: center;
  padding: 8px 10px 14px;
  border-top: 1.5px dashed rgba(26,26,26,0.35);
  flex-shrink: 0;
  gap: 4px;
}
.tabbar .t {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  font-family: 'Space Mono', monospace;
  font-size: 9px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--ink-light);
  cursor: pointer;
}
.tabbar .t .t-ic {
  width: 22px; height: 22px;
  border: 1.5px solid var(--ink-light);
  border-radius: 6px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  font-family: 'Caveat', cursive;
  font-weight: 700;
}
.tabbar .t.active { color: var(--ink); }
.tabbar .t.active .t-ic {
  border-color: var(--ink);
  background: var(--yellow);
}

/* Scrollable inner */
.body-scroll {
  flex: 1;
  overflow: hidden;
  padding: 14px 16px;
  position: relative;
}

/* Headline inside phone */
.h-big {
  font-family: 'Caveat', cursive;
  font-size: 30px;
  line-height: 1;
  font-weight: 700;
  margin: 0 0 4px;
}
.h-sub {
  font-family: 'Nunito';
  font-size: 13px;
  color: var(--ink-soft);
  margin: 0 0 12px;
}
.label-mono {
  font-family: 'Space Mono', monospace;
  font-size: 9px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--ink-light);
}

/* Progress dots */
.dots {
  display: inline-flex;
  gap: 5px;
  align-items: center;
}
.dots i {
  width: 8px; height: 8px; border-radius: 50%;
  border: 1.5px solid var(--ink);
  background: var(--paper);
  display: inline-block;
}
.dots i.on { background: var(--ink); }

/* Swipe card stack */
.stack {
  position: relative;
  width: 100%;
  aspect-ratio: 2/3;
  margin: 8px 0 10px;
}
.stack .card {
  position: absolute;
  inset: 0;
  border: 2px solid var(--ink);
  border-radius: 14px;
  overflow: hidden;
  background: var(--paper-2);
  display: flex;
  flex-direction: column;
}
.stack .card.back-1 { transform: rotate(-4deg) translate(-6px, 4px); opacity: 0.55; }
.stack .card.back-2 { transform: rotate(3deg) translate(6px, 8px); opacity: 0.3; }
.stack .card.front { box-shadow: 3px 4px 0 var(--ink); }

.card-poster {
  flex: 1;
  position: relative;
  display: flex;
  align-items: flex-end;
  padding: 12px;
}
.card-poster::before {
  content: '';
  position: absolute; inset: 0;
  background:
    repeating-linear-gradient(135deg,
      rgba(26,26,26,0.08) 0 1px,
      transparent 1px 10px);
}
.card-title {
  font-family: 'Caveat', cursive;
  font-size: 26px;
  line-height: 1;
  font-weight: 700;
  color: var(--ink);
  position: relative;
  z-index: 1;
}
.card-meta {
  font-family: 'Space Mono', monospace;
  font-size: 10px;
  color: var(--ink-soft);
  position: relative;
  z-index: 1;
  margin-top: 2px;
}
.card-actions {
  display: flex;
  justify-content: space-around;
  padding: 10px;
  background: var(--paper);
  border-top: 1.5px dashed var(--ink);
}
.circle-btn {
  width: 38px; height: 38px;
  border-radius: 50%;
  border: 2px solid var(--ink);
  background: var(--paper);
  font-family: 'Caveat', cursive;
  font-weight: 700;
  font-size: 20px;
  cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center;
}
.circle-btn.pink { background: var(--pink); color: white; box-shadow: 2px 2px 0 var(--ink); }
.circle-btn.yellow { background: var(--yellow); box-shadow: 2px 2px 0 var(--ink); }
.circle-btn.blue { background: var(--blue); color: white; box-shadow: 2px 2px 0 var(--ink); }
.circle-btn.mint { background: var(--mint); box-shadow: 2px 2px 0 var(--ink); }

/* Annotation scribble */
.annot {
  font-family: 'Caveat', cursive;
  font-size: 20px;
  color: var(--ink-soft);
  position: absolute;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  line-height: 1.1;
  max-width: 180px;
  z-index: 5;
  pointer-events: none;
}
.annot.tl { top: 30px; left: -150px; text-align: right; transform: rotate(-3deg); }
.annot.tr { top: 30px; right: -150px; text-align: left; transform: rotate(3deg); }
.annot.bl { bottom: 30px; left: -150px; text-align: right; transform: rotate(2deg); }
.annot.br { bottom: 30px; right: -150px; text-align: left; transform: rotate(-2deg); }
.annot .arrow { font-size: 26px; }

/* ============== TWEAKS PANEL ============== */
.tweaks {
  position: fixed;
  right: 18px;
  bottom: 18px;
  width: 280px;
  background: var(--paper);
  border: 2px solid var(--ink);
  border-radius: 14px;
  box-shadow: 4px 4px 0 var(--ink);
  padding: 14px 16px 16px;
  z-index: 100;
  display: none;
  font-family: 'Nunito';
}
.tweaks.open { display: block; }
.tweaks h3 {
  font-family: 'Caveat', cursive;
  font-size: 26px;
  margin: 0 0 10px;
  line-height: 1;
}
.tweaks .row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin: 10px 0;
  gap: 8px;
  font-size: 13px;
}
.tweaks .swatches {
  display: flex; gap: 6px;
}
.tweaks .sw {
  width: 22px; height: 22px;
  border-radius: 50%;
  border: 2px solid var(--ink);
  cursor: pointer;
}
.tweaks .sw.active { box-shadow: 0 0 0 2px var(--paper), 0 0 0 4px var(--ink); }
.tweaks .toggle {
  width: 40px; height: 22px;
  border: 2px solid var(--ink);
  border-radius: 14px;
  background: var(--paper);
  position: relative;
  cursor: pointer;
}
.tweaks .toggle::after {
  content: '';
  position: absolute;
  width: 14px; height: 14px;
  background: var(--ink);
  border-radius: 50%;
  top: 2px; left: 2px;
  transition: left .2s;
}
.tweaks .toggle.on { background: var(--mint); }
.tweaks .toggle.on::after { left: 20px; }

/* Fidelity: less-sketchy mode */
body.mode-clean .logo, body.mode-clean .tab,
body.mode-clean .cell-title, body.mode-clean .cell-num,
body.mode-clean .h-big, body.mode-clean .sbar-title,
body.mode-clean .card-title, body.mode-clean .btn,
body.mode-clean .circle-btn, body.mode-clean .gallery-head h2 {
  font-family: 'Nunito', system-ui !important;
}

/* Color intensity */
body.mode-muted .tab.active,
body.mode-muted .chip.chip-pink,
body.mode-muted .chip.chip-yellow,
body.mode-muted .chip.chip-blue,
body.mode-muted .chip.chip-mint,
body.mode-muted .chip.chip-lilac,
body.mode-muted .chip.chip-coral,
body.mode-muted .btn.btn-primary,
body.mode-muted .btn.btn-blue,
body.mode-muted .btn.btn-yellow,
body.mode-muted .btn.btn-mint,
body.mode-muted .circle-btn.pink,
body.mode-muted .circle-btn.yellow,
body.mode-muted .circle-btn.blue,
body.mode-muted .circle-btn.mint {
  filter: saturate(0.3) brightness(0.95);
}

.fab {
  position: fixed;
  right: 18px;
  bottom: 18px;
  width: 52px; height: 52px;
  border-radius: 50%;
  border: 2px solid var(--ink);
  background: var(--yellow);
  font-family: 'Caveat', cursive;
  font-weight: 700;
  font-size: 24px;
  cursor: pointer;
  box-shadow: 4px 4px 0 var(--ink);
  z-index: 99;
}

/* Tiny helpers */
.row-between { display:flex; align-items:center; justify-content:space-between; }
.gap-6 { gap:6px; } .gap-8 { gap:8px; } .gap-10 { gap:10px; } .gap-12 { gap:12px; }
.flex { display:flex; } .col { display:flex; flex-direction:column; }
.wrap { flex-wrap: wrap; }
.mt-4 { margin-top:4px; } .mt-6 { margin-top:6px; } .mt-8 { margin-top:8px; } .mt-10 { margin-top:10px; } .mt-12 { margin-top:12px; } .mt-16 { margin-top:16px; }
.mb-4 { margin-bottom:4px; } .mb-6 { margin-bottom:6px; } .mb-8 { margin-bottom:8px; } .mb-10 { margin-bottom:10px; } .mb-12 { margin-bottom:12px; }
.center { text-align:center; }
.grid-2 { display:grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.grid-3 { display:grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }

/* Subtle highlight strokes */
.strike {
  text-decoration: line-through;
  text-decoration-color: var(--pink);
  text-decoration-thickness: 2px;
}
.hi {
  background: linear-gradient(transparent 60%, rgba(255,201,60,0.6) 60%);
  padding: 0 3px;
}
.hi-pink {
  background: linear-gradient(transparent 60%, rgba(255,77,143,0.4) 60%);
  padding: 0 3px;
}

</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-row">
    <div class="logo">
      <span class="dot"></span>
      cinematch
      <span class="logo-sub">&nbsp;&nbsp;wireframe exploration · mid-fi · mobile</span>
    </div>
  </div>
  <div class="tabs" id="tabs">
    <div class="tab active" data-tab="ob"><span class="num">1</span>onboarding</div>
    <div class="tab" data-tab="mo"><span class="num">2</span>mood / vibe loop</div>
    <div class="tab" data-tab="de"><span class="num">3</span>movie detail &amp; why</div>
    <div class="tab" data-tab="system"><span class="num">★</span>design notes</div>
  </div>
</div>

<div id="root"></div>

<button class="fab" id="fab" title="Tweaks">✎</button>

<div class="tweaks" id="tweaks">
  <h3>Tweaks</h3>

  <div class="row">
    <span>Accent color</span>
    <div class="swatches" id="swatches">
      <div class="sw active" data-accent="pink" style="background:#FF4D8F"></div>
      <div class="sw" data-accent="blue" style="background:#4D6EFF"></div>
      <div class="sw" data-accent="yellow" style="background:#FFC93C"></div>
      <div class="sw" data-accent="mint" style="background:#5FD4A8"></div>
    </div>
  </div>

  <div class="row">
    <span>Fidelity: sketchy</span>
    <div class="toggle on" id="t-sketchy"></div>
  </div>

  <div class="row">
    <span>Bright colours</span>
    <div class="toggle on" id="t-colors"></div>
  </div>

  <div class="row">
    <span>Show annotations</span>
    <div class="toggle on" id="t-annots"></div>
  </div>

  <div style="margin-top:12px; font-family:'Space Mono', monospace; font-size:10px; color:var(--ink-light); letter-spacing:0.05em;">
    toggle panel: click ✎
  </div>
</div>

<!-- EDITMODE defaults -->
<script>
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "accent": "pink",
  "sketchy": true,
  "colors": true,
  "annotations": true
}/*EDITMODE-END*/;

    ob: { title: "Onboarding", subtitle: "6 directions for the first-time setup. The pain point today: it's boring. These lean hard into personality.", legend: "pick one, remix, or mash up", get variations(){ return window.OnboardingVariations || []; } },
    mo: { title: "Mood / Vibe Loop", subtitle: "Who's watching sets the route. Solo → slot machine (mashup). Group → 3-step overlap flow.", legend: "locked flow — iterating on slot machine details", get variations(){ return window.MoodVariations || []; } },
    de: { title: "Movie Detail + Why", subtitle: "Hybrid bars is locked in — poster, meta, vibe-bars and card actions on one screen. Mood card drops live here too.", legend: "locked: hybrid bars + mood card", get variations(){ return window.DetailVariations || []; } },
    system: null,
  };

  function AnnotLayer({ annots }) {
    if (!annots || !annots.length) return null;
    return h(Fragment, null, annots.map((a, i) => h('div', {key:i, className:'annot '+a.pos}, a.text)));
  }

  function Cell({ v }) {
    const Comp = v.Comp;
    return h('div', {className:'cell'},
      h('div', {className:'cell-tag'},
        h('div', {className:'cell-num'}, v.num),
        h('div', {className:'cell-title'}, v.title)
      ),
      h('div', {className:'cell-desc'}, v.desc),
      h('div', {style:{position:'relative'}},
        h(AnnotLayer, {annots: v.annots}),
        h(Comp)
      )
    );
  }

  function Gallery({ data }) {
    return h('div', {className:'gallery'},
      h('div', {className:'gallery-head'},
        h('h2', null, data.title),
        h('p', null, data.subtitle),
        h('div', {className:'legend'}, '// ' + data.legend)
      ),
      h('div', {className:'grid'}, data.variations.map((v, i) => h(Cell, {key:i, v})))
    );
  }

  function Notes() {
    const notes = [
      ['The brief', 'Cinematch is redesigning from a browser-first app to mobile-first. Current onboarding/vibe questionnaire feels boring. New personality goal: "knowledgable movie nerd with a great personality" — we named them Cine and gave them a voice across every flow.'],
      ['Visual system', '• Paper + ink background (warm cream, dark near-black) — a bright zine, not a dark theatre.\n• Four colour pops: hot pink · sunshine · electric blue · mint. Used as chip fills + accent stamps, never as whole backgrounds.\n• Type pairing: Caveat (hand-drawn display) + Nunito (body) + Space Mono (meta). Dashed borders, slight rotations, 3px hard shadows signal the sketchy stage.\n• Posters are striped placeholders — deliberately unreal so attention stays on structure, not hero images.'],
      ['Updates this round', '✓ Onboarding locked: V2 swipe → V6 fingerprint is the chosen path.\n\n✓ Mood/vibe locked: "who\'s watching?" fork. Solo → slot-machine mashup (swipeable reels + lock-and-roll + n/of signifier). Group → 3-step overlap flow is final.\n\n✓ Detail locked: Hybrid bars (poster + vibe-bars + card actions on one screen). Mood-card rare-drop wired in.'],
      ['Mood card — the rare-reward mechanic', 'Shareable Instagram-portrait asset summarising the user\'s month in film. Variable-ratio schedule: minimum 1/month, maximum 1/week — so it feels like a surprise, never predictable.\n\nTrigger: appears right after a film rating, only if the cooldown has passed AND there\'s enough watch data (≥3 films in window). Shown as a "RARE DROP" card ribbon with a reveal CTA.\n\nLives in: "me" tab → mood cards gallery. Past cards stay collectible (streaks, rarity, social fuel). "Share all" rolls up a multi-card post for end-of-year.\n\nSee Detail V4 (the card itself), V5 (the trigger screen), V6 (the collection).'],
      ['Open questions', '• Does Cine have an avatar (and does it animate)? Currently a yellow "C" circle.\n• What\'s the exact cooldown logic — fully random within bounds, or "Monday morning after ≥3 new films"? Needs a product call.\n• Slot machine details: is ROLL a single CTA or always-visible dice button? How disruptive is the spin animation?\n• Hybrid bars — do we need a "more" affordance to reach the full 6-bar detail screen?'],
      ['Suggested v1 hi-fi', 'Onboarding V2 swipe → V6 fingerprint. Mood: FORK → solo slot-machine mashup OR group 3-step. Detail: hybrid bars card. Mood Card drops via post-watch rating trigger on a variable schedule.'],
    ];
    return h('div', {className:'gallery'},
      h('div', {className:'gallery-head'},
        h('h2', null, 'Design notes'),
        h('p', null, 'Context, decisions, and what each flow is testing.')
      ),
      h('div', {style:{maxWidth:780, fontFamily:'Nunito', fontSize:15, lineHeight:1.55}},
        notes.map(([title, body], i) => h('div', {key:i},
          h('h3', {style:{fontFamily:'Caveat', fontSize:32, margin:'20px 0 8px', lineHeight:1}}, title),
          h('p', {style:{whiteSpace:'pre-wrap'}}, body)
        ))
      )
    );
  }

  function App() {
    const [tab, setTab] = useState(() => localStorage.getItem('cine_tab') || 'ob');

    useEffect(() => {
      localStorage.setItem('cine_tab', tab);
      document.querySelectorAll('.tab').forEach(el => {
        el.classList.toggle('active', el.dataset.tab === tab);
      });
    }, [tab]);

    useEffect(() => {
      const handler = (e) => {
        const el = e.target.closest('.tab');
        if (el) setTab(el.dataset.tab);
      };
      const tabsEl = document.getElementById('tabs');
      tabsEl.addEventListener('click', handler);
      return () => tabsEl.removeEventListener('click', handler);
    }, []);

    if (tab === 'system') return h(Notes);
    const data = GALLERIES[tab];
    if (!data || !data.variations.length) return h('div', {style:{padding:40}}, 'loading...');
    return h(Gallery, {data});
  }

  function tryRender(attempts){
    attempts = attempts || 0;
    try {
      if (window.OnboardingVariations && window.MoodVariations && window.DetailVariations) {
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(h(App));
        return;
      }
    } catch (err) {
      document.getElementById('root').innerHTML = '<pre style="padding:20px;color:#c00;font:11px monospace;white-space:pre-wrap;">'+(err.stack||err.message)+'</pre>';
      return;
    }
    if (attempts < 100) setTimeout(() => tryRender(attempts + 1), 50);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', () => tryRender());
  else tryRender();
})();
</script>

</body>
</html>
